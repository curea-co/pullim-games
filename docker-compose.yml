# games 로컬 개발용 Postgres.
# 포트 분리: 5432=본체 / 5433=Q / 5434=classbot / 5435=arcade / 5436=games (충돌 회피).
# prod 는 games 전용 Supabase (DATABASE_URL 로 주입) — 본 compose 는 dev 전용.
services:
  db:
    image: postgres:16
    container_name: pullim-games-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: games
    ports:
      - "5436:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d games"]
      interval: 5s
      timeout: 5s
      retries: 10
