name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (typecheck + lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate game registry
        run: npm run gen:registry

      # Plan R §5.3 가드 — manifest 와 generated 파일 sync 검증
      - name: Verify registry.generated.ts is in sync
        run: |
          if ! git diff --exit-code src/lib/games/registry.generated.ts; then
            echo "::error::registry.generated.ts is out of sync. Run 'npm run gen:registry' and commit." >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    name: build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  # Plan R §9.1 path-filtered game-level tests (V0.4 활성)
  # 게임이 늘어나면 lib/core 변경 시에만 풀 매트릭스, 게임만 변경 시 해당 게임만 실행.
  # 현재 게임 수 적어 풀 빌드가 빠르므로 별도 매트릭스 미활성.
