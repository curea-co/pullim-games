name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (typecheck + lint + registry sync)
    runs-on: ubuntu-latest
    # 모노레포 전환: 앱은 apps/games. run 스텝은 앱 디렉토리 기준.
    defaults:
      run:
        working-directory: apps/games
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate game registry
        run: bun run gen:registry

      # Plan R §5.3 가드 — manifest 와 generated 파일 sync 검증
      - name: Verify registry.generated.ts is in sync
        run: |
          if ! git diff --exit-code src/lib/games/registry.generated.ts; then
            echo "::error::registry.generated.ts is out of sync. Run 'bun run gen:registry' and commit." >&2
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

  # Plan R §9.1 — 변경된 파일을 분석해 영향 받는 게임 ID 와 core 여부 추출.
  # PR: 변경된 게임만 / push to main: 전체 게임 강제.
  detect-changes:
    name: detect changes (path filter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/games
    outputs:
      games: ${{ steps.resolve.outputs.games }}
      core_changed: ${{ steps.resolve.outputs.core_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: shell
          # paths-filter 는 리포 루트 기준 glob. 모노레포 전환으로 apps/games/ prefix.
          filters: |
            core:
              - 'apps/games/src/lib/core/**'
              - 'apps/games/src/lib/games/**'
              - 'apps/games/scripts/**'
              - 'apps/games/package.json'
              - 'apps/games/tsconfig.json'
              - 'apps/games/vitest.config.ts'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.base.json'
            games:
              - added|modified: 'apps/games/src/games/**'

      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          CORE: ${{ steps.filter.outputs.core }}
          GAME_FILES: ${{ steps.filter.outputs.games_files }}
        run: |
          set -euo pipefail
          ALL_GAMES=$(ls src/games | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ "$EVENT" = "push" ] || [ "$CORE" = "true" ]; then
            echo "core_changed=true" >> "$GITHUB_OUTPUT"
            echo "games=$ALL_GAMES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GAME_FILES 는 리포 루트 기준 경로: apps/games/src/games/<id>/...
          IDS=$(echo "$GAME_FILES" | tr ' ' '\n' | awk -F/ 'NF>=5 && $1=="apps" && $2=="games" && $3=="src" && $4=="games" {print $5}' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ "$IDS" = "[]" ] || [ -z "$IDS" ]; then
            IDS='[]'
          fi
          echo "core_changed=false" >> "$GITHUB_OUTPUT"
          echo "games=$IDS" >> "$GITHUB_OUTPUT"

  test-core:
    name: test (lib/core)
    needs: detect-changes
    if: needs.detect-changes.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/games
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run gen:registry
      - run: bunx vitest run src/lib/core

  test-game:
    name: test (game)
    needs: detect-changes
    if: needs.detect-changes.outputs.games != '[]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/games
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.detect-changes.outputs.games) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run gen:registry
      # 테스트가 없는 게임은 vitest 가 exit 1 — passWithNoTests 로 허용.
      - run: bunx vitest run --passWithNoTests src/games/${{ matrix.game }}

  test-auth:
    name: test (auth)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/games
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run gen:registry
      # 인증 스택(password/session/csrf/same-origin/schemas/라우트) 단위·라우트 테스트.
      # DB 불필요(라우트 테스트는 DB 계층 mock). plan 완료조건의 회귀 가드.
      - run: bunx vitest run src/lib/server/http src/lib/server/auth src/app/api/auth

  build:
    name: build (Next.js)
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/games
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build

  # Plan QA §4.6 — Playwright e2e (10 official 게임 × 6 viewport = 60 케이스).
  # webServer 가 build + start 를 spawn 하므로 build job 과 의존 X (병렬 가능).
  e2e:
    name: e2e (Playwright)
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/games
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run gen:registry

      - name: Resolve Playwright version
        id: pw
        run: |
          VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium + system deps
        run: bunx playwright install --with-deps chromium

      - name: Run e2e
        run: bun run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # upload-artifact 는 working-directory 미적용 → 리포 루트 기준 명시.
          path: |
            apps/games/playwright-report/
            apps/games/test-results/
          retention-days: 7
